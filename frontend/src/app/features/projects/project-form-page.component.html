<section class="project-form-space"><header class="project-form-header"><div><p class="eyebrow">Project workspace</p><h1>{{ projectId ? 'Edit project' : 'New project' }}</h1><span>Capture the request, owner, scope, and delivery expectations.</span></div><a routerLink="/projects">Back to projects</a></header><p *ngIf="loading" class="project-muted">Loading project...</p><p *ngIf="error" class="project-error">{{ error }}</p><form class="project-form" [formGroup]="form" (ngSubmit)="save()" *ngIf="!loading"><div class="form-grid"><label>Project name<input formControlName="name" maxlength="180" required /><small *ngIf="form.controls.name.touched && form.controls.name.invalid">Project name is required.</small></label><label>Reference<input formControlName="reference" maxlength="40" placeholder="PRJ-2026-001" required /><small *ngIf="form.controls.reference.touched && form.controls.reference.invalid">A reference is required.</small></label><label>Client<select formControlName="clientId" required><option value="">Select a client</option><option *ngFor="let client of clients" [value]="client.id">{{ client.name }}</option></select></label><label>Assigned associate<select formControlName="assignedAssociateId"><option value="">Unassigned</option><option *ngFor="let associate of associates" [value]="associate.id">{{ associate.fullName }}</option></select></label><label>Category<input formControlName="category" maxlength="120" /></label><label>Location<input formControlName="location" maxlength="255" /></label><label>Deadline<input type="date" formControlName="deadline" /></label><label>Status<select formControlName="status"><option *ngFor="let status of statuses" [value]="status">{{ status.replace('_',' ') }}</option></select></label><label>Estimated budget<input type="number" min="0" step="0.01" formControlName="estimatedBudget" /></label><label>Currency<input formControlName="currencyCode" maxlength="3" /></label></div><label>Description<textarea formControlName="description" rows="4" maxlength="4000"></textarea></label><label>Scope of work<textarea formControlName="scopeOfWork" rows="8" maxlength="10000" placeholder="Requirements, deliverables, technical specifications, and timeline"></textarea></label><label>Notes<textarea formControlName="notes" rows="4" maxlength="4000"></textarea></label><div class="project-form-actions"><button type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Save project' }}</button><a routerLink="/projects">Cancel</a></div></form></section>
