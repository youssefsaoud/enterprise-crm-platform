<section class="page-header"><p>Organization record</p><h1>{{ companyId ? 'Edit organization' : 'New organization' }}</h1></section><p *ngIf="loading" class="muted">Loading organization...</p><p *ngIf="error" class="error-message">{{ error }}</p><form class="entity-form" [formGroup]="form" (ngSubmit)="save()" *ngIf="!loading"><label>Name<input formControlName="name" maxlength="180" required /><small *ngIf="form.controls.name.touched&&form.controls.name.invalid">Name is required.</small></label><fieldset><legend>Organization roles</legend><label class="check-label"><input type="checkbox" [checked]="hasRole('CLIENT')" (change)="toggleRole('CLIENT',$any($event.target).checked)" /> Client</label><label class="check-label"><input type="checkbox" [checked]="hasRole('VENDOR')" (change)="toggleRole('VENDOR',$any($event.target).checked)" /> Vendor</label></fieldset><label>Industry<input formControlName="industry" maxlength="120" /></label><label>Website<input formControlName="website" maxlength="255" placeholder="https://example.com" /></label><label>Phone<input formControlName="phone" maxlength="60" /></label><label>Email<input type="email" formControlName="email" maxlength="180" /></label><label>Address<input formControlName="address" maxlength="255" /></label><div class="form-actions"><button type="submit" [disabled]="saving">{{ saving?'Saving...':'Save organization' }}</button><a routerLink="/companies">Cancel</a></div></form>
