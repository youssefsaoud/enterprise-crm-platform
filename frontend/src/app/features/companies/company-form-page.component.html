<section class="page-header">
  <p>Company record</p>
  <h1>{{ companyId ? 'Edit company' : 'New company' }}</h1>
</section>

<p *ngIf="loading" class="muted">Loading company...</p>
<p *ngIf="error" class="error-message">{{ error }}</p>

<form class="entity-form" [formGroup]="form" (ngSubmit)="save()" *ngIf="!loading">
  <label>
    Name
    <input formControlName="name" maxlength="180" required />
    <small *ngIf="form.controls.name.touched && form.controls.name.invalid">Name is required.</small>
  </label>
  <label>
    Industry
    <input formControlName="industry" maxlength="120" />
  </label>
  <label>
    Website
    <input formControlName="website" maxlength="255" />
  </label>
  <label>
    Phone
    <input formControlName="phone" maxlength="60" />
  </label>
  <label>
    Email
    <input type="email" formControlName="email" maxlength="180" />
    <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>
  </label>
  <label>
    Address
    <input formControlName="address" maxlength="255" />
  </label>

  <div class="form-actions">
    <button type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Save company' }}</button>
    <a routerLink="/companies">Cancel</a>
  </div>
</form>
