<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/dashboard">CRM Foundation</a>
    <nav>
      <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
        {{ item.label }}
      </a>
    </nav>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <strong>Sales CRM</strong>
        <span>Month 3 companies and contacts module</span>
      </div>
      <ng-container *ngIf="currentUser$ | async as user; else anonymous">
        <div class="user-menu">
          <span>{{ user.fullName }} · {{ user.role }}</span>
          <button type="button" (click)="logout()">Logout</button>
        </div>
      </ng-container>
      <ng-template #anonymous>
        <a class="login-link" routerLink="/login">Login</a>
      </ng-template>
    </header>
    <main class="content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
